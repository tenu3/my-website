
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My First Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        /* Header */
        header {
            background: #172554;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            color: #93c5fd;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 100px 20px;
            background: #dbeafe;
        }

        .hero h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        /* Button */
        button {
            background: #2563eb;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            background: #1d4ed8;
            transform: scale(1.05);
        }

        /* Sections */
        section {
            padding: 60px 20px;
            text-align: center;
        }

        section h2 {
            margin-bottom: 15px;
        }

        #message {
            color: #166534;
            font-weight: bold;
            margin-top: 25px;
        }

        /* Footer */
        footer {
            background: #172554;
            color: white;
            padding: 20px;
            text-align: center;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 8px;
            }

            .hero h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h2>My Website</h2>

        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- Home Section -->
    <div class="hero" id="home">

        <h1>Welcome to My Website!</h1>

        <p>
            Built using HTML, CSS and JavaScript.
        </p>

        <button onclick="showMessage()">
            Get Started
        </button>

        <p id="message"></p>

    </div>

    <!-- About Section -->
    <section id="about">

        <h2>About Us</h2>

        <p>
            This is a simple website created using
            HTML, CSS and JavaScript in a single file.
        </p>

    </section>

    <!-- Contact Section -->
    <section id="contact">

        <h2>Contact Us</h2>

        <p>
            Email: example@gmail.com
        </p>

    </section>

    <!-- Footer -->
    <footer>

        <p>
            © 2026 My Website. All Rights Reserved.
        </p>

    </footer>

    <!-- JavaScript -->
    <script>

        function showMessage() {

            // Display welcome message
            document.getElementById("message").innerText =
                "Welcome! Thanks for getting started with my website.";

            // Smooth scroll to About section
            document.getElementById("about").scrollIntoView({
                behavior: "smooth"
            });

        }

    </script>

</body>
</html>
